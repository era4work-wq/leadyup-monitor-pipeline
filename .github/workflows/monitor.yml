name: Мониторинг и отбор тем

on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC = 09:00 МСК
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      # ref явно на имя ветки — см. подробный комментарий в write-drafts.yml.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Сбор RSS
        working-directory: src
        run: python collect.py

      - name: Отбор Claude Haiku (через OpenRouter)
        working-directory: src
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python select_topics.py

      - name: Отправка на согласование в Telegram
        working-directory: src
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ARTICLES_ENABLED: ${{ secrets.ARTICLES_ENABLED }}
          CAROUSELS_ENABLED: ${{ secrets.CAROUSELS_ENABLED }}
        run: python notify_telegram.py

      - name: Сохранить state и data обратно в репозиторий
        run: |
          git config user.name "leadyup-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ data/
          git diff --cached --quiet && exit 0
          git commit -m "monitor: $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
