name: Опрос согласований в Telegram

on:
  schedule:
    - cron: "*/15 * * * *"  # подстраховка — GitHub сильно задерживает частые cron, основной триггер теперь вебхук ниже
  workflow_dispatch:
    inputs:
      telegram_update:
        description: "JSON одного апдейта Telegram (от webhook-relay/), опционально"
        required: false
        type: string

permissions:
  contents: write
  actions: write  # нужно, чтобы дёргать write-drafts.yml/publish-queue.yml сразу по клику (см. шаг ниже)

# Concurrency-группа тут раньше стояла, чтобы не пушить параллельно — но
# у GitHub Actions очередь на группу держит только ОДНО ожидающее место:
# при быстрых повторных кликах (например переключение форматов пост/статья/
# карусель на одной теме) каждый новый запуск отменяет ещё не выполнившийся
# предыдущий, а не встаёт за ним в очередь (подтверждено 31.07.2026 — часть
# кликов владелицы ушли в cancelled, форматы не применились). Вместо
# concurrency корректность даёт retry-цикл ниже: при конфликте пуша откат к
# свежему origin и переигровка обработки — safe, потому что каждый прогон
# сначала читает актуальное состояние. Без concurrency все клики реально
# выполняются, просто иногда через пару попыток retry вместо одной.

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      # ref явно на имя ветки — см. подробный комментарий в write-drafts.yml.
      # Тут нет concurrency-группы (см. коммент выше), поэтому очередей быть
      # не должно, но на всякий случай — то же самое дёшево и безопасно.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Опрос Telegram и сохранение (с ретраем при гонке параллельных вебхуков)
        id: poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          ARTICLES_ENABLED: ${{ secrets.ARTICLES_ENABLED }}
          TELEGRAM_UPDATE_JSON: ${{ github.event.inputs.telegram_update }}
        run: |
          git config user.name "leadyup-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # Вебхук может прислать несколько кликов почти одновременно — два
          # запуска этого workflow могут пушить одновременно и словить
          # конфликт на одном и том же файле очереди (было на практике
          # 30.07.2026). При конфликте откатываемся к свежему origin/main и
          # переигрываем обработку с нуля — обработка одного и того же
          # апдейта безопасно повторяема (Telegram API вызовы идемпотентны
          # по эффекту, а данные на диске всегда берутся из чистого origin).
          for attempt in 1 2 3 4 5; do
            (cd src && python collect_approvals.py)
            git add state/ data/
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "approvals: $(date -u +%Y-%m-%dT%H:%M)"
            if git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "::warning::Конфликт при push (попытка $attempt) — откатываюсь и переигрываю"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            sleep $(( (RANDOM % 5) + attempt ))
          done
          echo "::error::Не удалось сохранить после нескольких попыток"
          exit 1

      - name: Дёрнуть генерацию и очередь публикации сразу, не ждать расписание/тикер
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED: ${{ steps.poll.outputs.approved }}
          QUEUED: ${{ steps.poll.outputs.queued }}
        run: |
          # Триггерим ТОЛЬКО если этот клик реально породил новую работу —
          # write-drafts.yml только если что-то взяли в работу (take),
          # publish-queue.yml только если что-то поставили в очередь
          # (publish). Раньше триггерили безусловно на любой клик (даже
          # тумблер формата или skip/reject) — при быстрой серии кликов это
          # плодило несколько параллельных запусков write-drafts.yml,
          # которые сталкивались на пуше одного файла: проигравший терял
          # результат целиком (это НЕ спасала concurrency-группа — она не
          # даёт двум запускам работать ОДНОВРЕМЕННО, но каждый следующий
          # успевал стартовать до пуша предыдущего при частых триггерах), и
          # следующий запуск генерировал ту же тему заново с нуля — отсюда
          # задвоенные, по-разному сгенерированные посты (поймано на
          # практике 01.08.2026). redo/redo_en/redo_car/redo_car_en сюда не
          # относятся — они уже сами генерируют и шлют карточку внутри
          # collect_approvals.py, write-drafts.yml им не нужен.
          if [ "$APPROVED" = "true" ]; then
            gh workflow run write-drafts.yml
          fi
          if [ "$QUEUED" = "true" ]; then
            gh workflow run publish-queue.yml
          fi
