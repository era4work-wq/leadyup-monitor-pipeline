name: Опрос согласований в Telegram

on:
  schedule:
    - cron: "*/15 * * * *"  # каждые ~15 минут (GitHub может задерживать под нагрузкой)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: poll-approvals
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Опрос Telegram getUpdates
        working-directory: src
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python collect_approvals.py

      - name: Сохранить решения обратно в репозиторий
        run: |
          git config user.name "leadyup-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/ data/
          git diff --cached --quiet && exit 0
          git commit -m "approvals: $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
