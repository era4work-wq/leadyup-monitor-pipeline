name: Опрос согласований в Telegram

on:
  schedule:
    - cron: "*/15 * * * *"  # подстраховка — GitHub сильно задерживает частые cron, основной триггер теперь вебхук ниже
  workflow_dispatch:
    inputs:
      telegram_update:
        description: "JSON одного апдейта Telegram (от webhook-relay/), опционально"
        required: false
        type: string

permissions:
  contents: write

# Concurrency-группа тут раньше стояла, чтобы не пушить параллельно — но
# у GitHub Actions очередь на группу держит только ОДНО ожидающее место:
# при быстрых повторных кликах (например переключение форматов пост/статья/
# карусель на одной теме) каждый новый запуск отменяет ещё не выполнившийся
# предыдущий, а не встаёт за ним в очередь (подтверждено 31.07.2026 — часть
# кликов владелицы ушли в cancelled, форматы не применились). Вместо
# concurrency корректность даёт retry-цикл ниже: при конфликте пуша откат к
# свежему origin и переигровка обработки — safe, потому что каждый прогон
# сначала читает актуальное состояние. Без concurrency все клики реально
# выполняются, просто иногда через пару попыток retry вместо одной.

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Опрос Telegram и сохранение (с ретраем при гонке параллельных вебхуков)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
          TELEGRAM_UPDATE_JSON: ${{ github.event.inputs.telegram_update }}
        run: |
          git config user.name "leadyup-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          # Вебхук может прислать несколько кликов почти одновременно — два
          # запуска этого workflow могут пушить одновременно и словить
          # конфликт на одном и том же файле очереди (было на практике
          # 30.07.2026). При конфликте откатываемся к свежему origin/main и
          # переигрываем обработку с нуля — обработка одного и того же
          # апдейта безопасно повторяема (Telegram API вызовы идемпотентны
          # по эффекту, а данные на диске всегда берутся из чистого origin).
          for attempt in 1 2 3 4 5; do
            (cd src && python collect_approvals.py)
            git add state/ data/
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "approvals: $(date -u +%Y-%m-%dT%H:%M)"
            if git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "::warning::Конфликт при push (попытка $attempt) — откатываюсь и переигрываю"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            sleep $(( (RANDOM % 5) + attempt ))
          done
          echo "::error::Не удалось сохранить после нескольких попыток"
          exit 1
