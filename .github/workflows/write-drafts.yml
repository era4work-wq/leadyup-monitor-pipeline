name: Написать черновики (пост, карусель, статья)

on:
  schedule:
    - cron: "0 15 * * *"  # 15:00 UTC = 18:00 МСК — даёт дню время на согласование тем
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: write-drafts
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Записать сервисный аккаунт Google Drive
        run: |
          mkdir -p secrets
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}' > secrets/drive-service-account.json

      # continue-on-error на каждом этапе — три формата независимы, сбой
      # одного (сетевой сбой, модель отказала) не должен ронять остальные
      # и не должен пропускать финальное сохранение уже готовых результатов.
      - name: Генерация черновиков (пост)
        working-directory: src
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python write_draft.py

      - name: Отправка поста на финальное согласование
        working-directory: src
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_final.py

      - name: Генерация карусели
        working-directory: src
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python write_carousel.py

      - name: Отправка карусели на согласование
        working-directory: src
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_carousel.py

      - name: Генерация статьи
        working-directory: src
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python write_article.py

      - name: Отправка статьи файлом в чат
        working-directory: src
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_article.py

      - name: Сохранить черновики обратно в репозиторий
        if: always()
        run: |
          git config user.name "leadyup-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "drafts: $(date -u +%Y-%m-%dT%H:%M)"
          # Прогон теперь может дёргаться сразу по каждому клику "Взять"
          # (см. poll-approvals.yml), а сама генерация длится минуты — за
          # это время параллельно может уйти push из другого клика. Пуш
          # уже готового коммита ретраим через pull --rebase, не через
          # git reset --hard (это стёрло бы только что сгенерированные,
          # но ещё не запушенные черновики) — если сам rebase конфликтует
          # (редкость, разные файлы обычно перебазируются чисто), останавливаемся
          # и сообщаем явно, а не теряем результат молча.
          for attempt in 1 2 3 4 5; do
            if git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "::warning::Конфликт при push (попытка $attempt) — подтягиваю и перебазируюсь"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "::error::Конфликт при rebase — нужна ручная проверка, локальный коммит с черновиками не потерян в рамках этого прогона"
              exit 1
            fi
            sleep $(( (RANDOM % 5) + attempt ))
          done
          echo "::error::Не удалось запушить после нескольких попыток"
          exit 1
