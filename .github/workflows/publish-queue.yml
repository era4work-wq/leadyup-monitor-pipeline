name: Публикация из очереди

on:
  schedule:
    - cron: "*/20 * * * *"  # каждые ~20 минут — скрипт сам решает, публиковать ли (окно + интервал)
  workflow_dispatch:
    inputs:
      smoke_test:
        description: "Тестовое сообщение в Max/ВК напрямую (не трогает очередь/Telegram) — для проверки токенов/сертификатов без ожидания дневного окна"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: playwright install --with-deps chromium

      - name: Записать сервисный аккаунт Google Drive
        run: |
          mkdir -p secrets
          echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}' > secrets/drive-service-account.json

      - name: Тест Max/ВК напрямую (только если запущено с smoke_test)
        if: ${{ github.event.inputs.smoke_test == 'true' }}
        working-directory: src
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          python -c "
          import glob, json, os
          import drive_banners, publish, publish_max, publish_vk
          text = 'Тестовое сообщение пайплайна — проверка Max/ВК с картинкой. Можно удалить.'
          queue_files = sorted(glob.glob('../data/publish_queue/*.json'))
          entry = None
          if queue_files:
              items = json.load(open(queue_files[-1], encoding='utf-8'))
              entry = items[0] if items else None
          service = drive_banners.get_service()
          cover_bytes = publish.render_banner(entry, service) if entry else None
          print('баннер:', f'{len(cover_bytes)} байт, сигнатура {cover_bytes[:8]!r}' if cover_bytes else 'нет')
          ok_max = publish_max.publish(os.environ['MAX_BOT_TOKEN'], os.environ['MAX_CHAT_ID'], text, image_bytes=cover_bytes)
          print('Max:', 'OK' if ok_max else 'ОШИБКА')
          ok_vk = publish_vk.publish(os.environ['VK_GROUP_TOKEN'], os.environ['VK_GROUP_ID'], text, image_bytes=cover_bytes, user_token=os.environ.get('VK_USER_TOKEN'))
          print('VK:', 'OK' if ok_vk else 'ОШИБКА')
          "

      - name: Публикация из очереди (не больше одной записи за раз)
        if: ${{ github.event.inputs.smoke_test != 'true' }}
        working-directory: src
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          VK_GROUP_TOKEN: ${{ secrets.VK_GROUP_TOKEN }}
          VK_USER_TOKEN: ${{ secrets.VK_USER_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: python publish_queue.py

      - name: Сохранить состояние очереди обратно в репозиторий
        if: ${{ github.event.inputs.smoke_test != 'true' }}
        run: |
          git config user.name "leadyup-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ state/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "publish-queue: $(date -u +%Y-%m-%dT%H:%M)"
          # Прогон теперь может дёргаться сразу по клику "Опубликовать" (см.
          # poll-approvals.yml) в дополнение к тикеру каждые ~20 минут — пуш
          # уже готового коммита (публикация уже фактически ушла на площадки)
          # ретраим через pull --rebase, не через git reset --hard, чтобы не
          # потерять запись о том, что пост уже опубликован.
          for attempt in 1 2 3 4 5; do
            if git push origin "${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "::warning::Конфликт при push (попытка $attempt) — подтягиваю и перебазируюсь"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              echo "::error::Конфликт при rebase — нужна ручная проверка, публикация уже прошла, но статус в данных мог не сохраниться"
              exit 1
            fi
            sleep $(( (RANDOM % 5) + attempt ))
          done
          echo "::error::Не удалось запушить после нескольких попыток"
          exit 1
