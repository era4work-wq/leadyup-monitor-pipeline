<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Баннер поста/статьи 1920×1080 (16:9)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; }
  body {
    font-family: var(--font-body);
    color: #fff;
    background: var(--bg-dark);
    position: relative;
    overflow: hidden;
  }
  /* Фон — готовый баннер из БАННЕРЫ/<тема>/, без текста. Заменять background-image. */
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('{{BACKGROUND}}');
    background-size: cover;
    background-position: center;
  }
  /* Затемняющий градиент под текстом — гарантирует читаемость независимо
     от того, что происходит на самой картинке в этом месте. */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(5,8,16,0.94) 0%, rgba(5,8,16,0.75) 32%, rgba(5,8,16,0.15) 58%, transparent 72%);
  }
  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 96px 0 96px 96px;
    max-width: 960px;
  }
  .badge {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--bg-dark);
    background: var(--green-3);
    border-radius: 999px;
    padding: 10px 26px;
    margin-bottom: 40px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 108px;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  h1 em {
    font-style: normal;
    color: var(--green-3);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="content">
    <span class="badge">{{BADGE}}</span>
    <h1>{{HEADLINE}}</h1>
  </div>
</body>
</html>
