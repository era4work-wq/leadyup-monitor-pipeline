<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карусель — обложка с фото 1080×1350</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800;900&family=Inter:wght@500;600&family=JetBrains+Mono:wght@500;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body {
    font-family: var(--font-body);
    color: #fff;
    background: var(--bg-dark);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 88px 84px 72px;
  }
  .bg {
    position: absolute;
    inset: 0;
    background-image: url('{{BACKGROUND}}');
    background-size: cover;
    background-position: 70% 15%;
  }
  /* Тёмный градиент снизу — под заголовок и подвал, фото остаётся видно сверху */
  .scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(5,8,16,0.15) 0%, rgba(5,8,16,0.55) 55%, rgba(5,8,16,0.96) 100%);
  }
  .top, .footer, .content { position: relative; }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 72px;
  }
  .tag {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 30px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--bg-dark);
    background: var(--green-3);
    border-radius: var(--radius-lg);
    padding: 14px 30px;
  }
  .slide-num {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 34px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .content { margin-top: auto; }
  h1 {
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 84px;
    line-height: 1.06;
    letter-spacing: -0.02em;
  }
  h1 em {
    font-style: normal;
    color: var(--green-3);
  }
  .body-text {
    font-size: 38px;
    line-height: 1.4;
    color: rgba(255,255,255,0.85);
    margin-top: 28px;
    max-width: 820px;
  }
  .footer {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 3px solid rgba(255,255,255,0.2);
    padding-top: 40px;
  }
  .brand {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 40px;
    color: #fff;
    white-space: nowrap;
    margin-right: 48px;
  }
  .brand .dot { color: var(--green-3); }
  .cta {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 30px;
    color: rgba(255,255,255,0.7);
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="scrim"></div>
  <div class="top">
    <div class="tag">{{BADGE}}</div>
    <div class="slide-num">{{SLIDE_NUM}}</div>
  </div>
  <div class="content">
    <h1>{{HEADLINE}}</h1>
    <p class="body-text">{{BODY}}</p>
  </div>
  <div class="footer">
    <div class="brand">LeadYup</div>
    <div class="cta">leadyup.com · бесплатно за 2 минуты</div>
  </div>
</body>
</html>
